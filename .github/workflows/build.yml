# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build-and-release
on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: make crossover gradle wrapper executable
        working-directory: beamng/minecraft
        run: chmod +x ./gradlew
      - name: test BeamNG crossover
        working-directory: beamng/minecraft
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: |
            build/libs/*.jar
            beamng/minecraft/build/libs/*.jar

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: checkout tagged source
        uses: actions/checkout@v6
      - name: download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: Artifacts
          path: artifacts
      - name: package release
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          directory="BeamCraft-${tag}"
          mkdir -p "release/${directory}"
          git archive "${GITHUB_SHA}" | tar -x -C "release/${directory}"
          jar="$(find artifacts -type f -path '*/beamng/minecraft/build/libs/bng-bridge-*.jar' ! -name '*-sources.jar' -print -quit)"
          test -n "${jar}"
          cp "${jar}" "release/${directory}/"
          cp "${jar}" "release/bng-bridge-${tag}.jar"
          (cd release && zip -qr "../BeamCraft-${tag}.zip" "${directory}")
      - name: publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: BeamCraft ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            BeamCraft release for Windows. BeamCraft is a one-player experience that runs on a single PC. You must own and install both BeamNG.drive and Minecraft.

            ## Downloads
            - `BeamCraft-${{ github.ref_name }}.zip`: complete project and built Fabric mod. Extract it and launch with `play.bat`; the launcher sets up and starts the local game components.
            - `bng-bridge-${{ github.ref_name }}.jar`: the Fabric mod by itself. For the complete launcher and BeamNG extension, use the project ZIP.

            ## Tested setup
            - BeamNG.drive 0.39.4
            - Minecraft 1.21.1 with Fabric
            - One player on one PC; shared/network play is not supported.
            - G923 H-shifter and clutch work in-game. Wheel support is experimental, force feedback is not implemented, and the rendered steering wheel stays static.
          files: |
            BeamCraft-${{ github.ref_name }}.zip
            release/bng-bridge-${{ github.ref_name }}.jar
